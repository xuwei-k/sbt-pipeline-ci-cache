on:
  pull_request:
  push:
jobs:
  test1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pipeline:
          - true
          - false
    steps:
    - uses: actions/checkout@v6
    - uses: sbt/setup-sbt@v1
    - uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: zulu
    - run: sbt -v --server -Dpipelining=${{ matrix.pipeline }} compile
    - uses: actions/upload-artifact@v7
      with:
        name: pipeline-${{ matrix.pipeline }}-a1
        path: a1/target
    - uses: actions/upload-artifact@v7
      with:
        name: pipeline-${{ matrix.pipeline }}-a2
        path: a2/target
  test2:
    needs:
    - test1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pipeline:
          - true
          - false
    steps:
    - uses: actions/checkout@v6
    - uses: sbt/setup-sbt@v1
    - uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: zulu
    - uses: actions/download-artifact@v8
      with:
        name: pipeline-${{ matrix.pipeline }}-a1
        path: a1/target
    - uses: actions/download-artifact@v8
      with:
        name: pipeline-${{ matrix.pipeline }}-a2
        path: a2/target
    - run: sbt -v --server -Dpipelining=${{ matrix.pipeline }} compile
